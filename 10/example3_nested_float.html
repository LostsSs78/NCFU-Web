<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Вложенные плавающие блоки</title>
    <style>
        div {
            margin: 10px;
            padding: 20px;
            border: 1px solid black;
        }

        #header {
            background: #ccc;
        }

        #sidebar {
            background: #bbb;
            float: right;
            width: 150px;
        }

        #main {
            background: #fafafa;
            margin-right: 170px;
        }

        #menu {
            background: #ddd;
            float: left;
            width: 150px;
        }

        #content {
            background: #eee;
            margin-left: 170px;
        }

        #footer {
            background: #ccc;
            clear: both;
        }
    </style>
</head>

<body>

    <div id="header">Шапка</div>
    <div id="sidebar">Правый сайдбар</div>

    <div id="main">
        <div id="menu">Меню</div>
        <div id="content">Контент</div>
    </div>

    <div id="footer">Футер</div>

</body>

</html>
