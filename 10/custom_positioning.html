<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Позиционирование элементов — вариант 2</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
}

/* Фиксированная боковая панель */
.sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 200px;
    height: 100%;
    background: #1e3a8a;
    color: white;
    padding: 20px;
}

/* Основной контент */
.content {
    margin-left: 220px;
    padding: 40px;
}

/* Родительский контейнер */
.card-container {
    position: relative;
    width: 500px;
    height: 300px;
    background: #f3f4f6;
    border: 2px solid #ccc;
    margin-bottom: 40px;
}

/* Первая карточка */
.card1 {
    position: absolute;
    top: 40px;
    left: 60px;
    width: 200px;
    height: 120px;
    background: #ef4444;
    color: white;
    padding: 15px;
    z-index: 2;
}

/* Вторая карточка */
.card2 {
    position: absolute;
    top: 100px;
    left: 140px;
    width: 200px;
    height: 120px;
    background: #3b82f6;
    color: white;
    padding: 15px;
    z-index: 1;
}

/* Третья карточка поверх всех */
.card3 {
    position: absolute;
    top: 70px;
    left: 220px;
    width: 180px;
    height: 100px;
    background: #10b981;
    color: white;
    padding: 10px;
    z-index: 3;
}

/* Блок с относительным позиционированием */
.relative-box {
    position: relative;
    width: 300px;
    height: 200px;
    background: #e5e7eb;
    margin-top: 40px;
}

/* Абсолютный элемент внутри relative */
.absolute-inside {
    position: absolute;
    bottom: 10px;
    right: 10px;
    background: black;
    color: white;
    padding: 8px 12px;
}

</style>
</head>

<body>

<div class="sidebar">
    <h3>Меню</h3>
    <p>Главная</p>
    <p>О нас</p>
    <p>Контакты</p>
</div>

<div class="content">

    <h1>Демонстрация позиционирования</h1>

    <div class="card-container">
        <div class="card1">Блок 1 (z-index:2)</div>
        <div class="card2">Блок 2 (z-index:1)</div>
        <div class="card3">Блок 3 (z-index:3)</div>
    </div>

    <div class="relative-box">
        Относительный контейнер
        <div class="absolute-inside">
            Абсолютный внутри
        </div>
    </div>

</div>

</body>
</html>
