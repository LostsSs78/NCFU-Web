<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Трехколоночная верстка</title>
    <style>
        div {
            margin: 10px;
            padding: 20px;
            border: 1px solid black;
        }

        #header {
            background: #ccc;
        }

        #left {
            background: #ddd;
            float: left;
            width: 150px;
        }

        #right {
            background: #bbb;
            float: right;
            width: 150px;
        }

        #main {
            background: #eee;
            margin: 0 170px;
            height: 200px;
        }

        #footer {
            background: #ccc;
            clear: both;
        }
    </style>
</head>

<body>

    <div id="header">Шапка сайта</div>
    <div id="left">Левый сайдбар</div>
    <div id="right">Правый сайдбар</div>
    <div id="main">Основное содержимое</div>
    <div id="footer">Футер</div>

</body>

</html>
