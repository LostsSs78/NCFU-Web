<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Позиционирование</title>
    <style>
        .box {
            position: relative;
            width: 300px;
            height: 300px;
            background: #eee;
        }

        .red {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 100px;
            height: 100px;
            background: red;
            z-index: 2;
        }

        .blue {
            position: absolute;
            top: 80px;
            left: 80px;
            width: 100px;
            height: 100px;
            background: blue;
        }
    </style>
</head>

<body>

    <div class="box">
        <div class="red"></div>
        <div class="blue"></div>
    </div>

</body>

</html>
