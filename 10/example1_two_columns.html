<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Двухколоночная верстка</title>
    <style>
        div {
            margin: 10px;
            padding: 20px;
            border: 1px solid black;
        }

        #header {
            background: #ccc;
        }

        #sidebar {
            background: #ddd;
            float: left;
            width: 150px;
        }

        #main {
            background: #eee;
            margin-left: 170px;
            height: 200px;
        }

        #footer {
            background: #ccc;
            clear: both;
        }
    </style>
</head>

<body>

    <div id="header">Шапка сайта</div>
    <div id="sidebar">Сайдбар</div>
    <div id="main">Основное содержимое</div>
    <div id="footer">Футер</div>

</body>

</html>
